services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sociallocal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sociallocal}
      POSTGRES_DB: sociallocal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sociallocal -d sociallocal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "5000"
      DATABASE_URL: "postgresql://sociallocal:${POSTGRES_PASSWORD:-sociallocal}@postgres:5432/sociallocal"
      NODE_ENV: production
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost}"
      APP_URL: "${APP_URL:-http://localhost}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      HUGGING_FACE_API_KEY: "${HUGGING_FACE_API_KEY:-}"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
