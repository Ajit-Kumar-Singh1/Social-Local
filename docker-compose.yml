services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sociallocal
      POSTGRES_PASSWORD: sociallocal
      POSTGRES_DB: sociallocal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sociallocal -d sociallocal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: "postgresql://sociallocal:sociallocal@postgres:5432/sociallocal"
      NODE_ENV: production
      # Set this to your machine's URL so upload URLs are correct
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:5000}"
      # Set this so Facebook OAuth callbacks work
      APP_URL: "${APP_URL:-http://localhost}"
      # Facebook App credentials (required for OAuth)
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      # Optional: Hugging Face API key for AI image generation
      HUGGING_FACE_API_KEY: "${HUGGING_FACE_API_KEY:-}"
    volumes:
      - uploads_data:/app/artifacts/api-server/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: artifacts/social-local/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
