kind = "web"
previewPath = "/"
title = "Social Local"
version = "1.0.0"
id = "artifacts/social-local"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20771

[services.development]
run = "pnpm --filter @workspace/social-local run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-local", "run", "build" ]
publicDir = "artifacts/social-local/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20771"
BASE_PATH = "/"
